<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TNEhindi | The Next Episode Hindi</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#03030a;color:#fff;font-family:Arial,sans-serif}
.stage{position:relative;width:min(100%,1024px);margin:auto}.design{display:block;width:100%;height:auto}
.hot{position:absolute;display:block;z-index:3}
.searchBtn{left:91%;top:10.3%;width:7%;height:4.5%;border:0;background:transparent;cursor:pointer}
.searchPanel{display:none;position:fixed;z-index:20;left:50%;top:15px;transform:translateX(-50%);width:min(94%,700px);padding:12px;background:#090914;border:1px solid #ff2c9d;border-radius:15px;box-shadow:0 0 30px #009dff55}
.searchPanel.show{display:block}.searchRow{display:flex;gap:8px}.searchRow input{flex:1;min-width:0;padding:13px;border-radius:10px;border:1px solid #555;background:#050509;color:#fff;font-size:16px}.searchRow button{border:0;border-radius:10px;padding:0 15px;background:#e71651;color:#fff;font-weight:bold}
.results{display:grid;gap:7px;margin-top:9px}.results a{padding:11px;border:1px solid #333;border-radius:9px;color:#fff;text-decoration:none;background:#10101a}
.love{left:2%;top:43.7%;width:23%;height:13.5%}.romantic{left:26%;top:43.7%;width:23%;height:13.5%}.horror{left:50%;top:43.7%;width:23%;height:13.5%}.emotional{left:74%;top:43.7%;width:24%;height:13.5%}
.thriller{left:2%;top:58%;width:23%;height:13.3%}.family{left:26%;top:58%;width:23%;height:13.3%}.comedy{left:50%;top:58%;width:23%;height:13.3%}.mystery{left:74%;top:58%;width:24%;height:13.3%}
.youtube{left:5%;top:91.8%;width:21%;height:3.7%}.instagram{left:28%;top:91.8%;width:21%;height:3.7%}.facebook{left:52%;top:91.8%;width:21%;height:3.7%}.telegram{left:76%;top:91.8%;width:21%;height:3.7%}
</style></head><body>
<div class="searchPanel" id="sp"><div class="searchRow"><input id="q" placeholder="Search Love, Horror, Comedy..."><button onclick="closeSearch()">✕</button></div><div class="results" id="results"></div></div>
<div class="stage"><img class="design" src="homepage-design.jpg" alt="TNEhindi homepage">
<button class="hot searchBtn" onclick="openSearch()" aria-label="Search"></button>
<a class="hot love" href="genre.html?g=love"></a><a class="hot romantic" href="genre.html?g=romantic"></a><a class="hot horror" href="genre.html?g=horror"></a><a class="hot emotional" href="genre.html?g=emotional"></a>
<a class="hot thriller" href="genre.html?g=thriller"></a><a class="hot family" href="genre.html?g=family-drama"></a><a class="hot comedy" href="genre.html?g=comedy"></a><a class="hot mystery" href="genre.html?g=mystery"></a>
<a class="hot youtube" href="https://www.youtube.com/@TNEhindi"></a><a class="hot instagram" href="https://www.instagram.com/tnehindiofficialll/"></a><a class="hot facebook" href="https://www.facebook.com/TNEhindi"></a><a class="hot telegram" href="https://t.me/TNEhindi"></a>
</div>
<script>
const items=[["Love","love"],["Romantic","romantic"],["Horror","horror"],["Emotional","emotional"],["Thriller","thriller"],["Family Drama","family-drama"],["Comedy","comedy"],["Mystery","mystery"]];
function openSearch(){document.getElementById("sp").classList.add("show");document.getElementById("q").focus();render("")}
function closeSearch(){document.getElementById("sp").classList.remove("show")}
function render(v){let r=document.getElementById("results");let a=items.filter(x=>x[0].toLowerCase().includes(v.toLowerCase()));r.innerHTML=a.map(x=>`<a href="genre.html?g=${x[1]}">🎬 ${x[0]} Videos</a>`).join("")||"<div>No results found</div>"}
document.getElementById("q").addEventListener("input",e=>render(e.target.value));
</script></body></html>
