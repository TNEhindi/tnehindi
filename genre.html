<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TNEhindi Videos</title>
<style>*{box-sizing:border-box}body{margin:0;background:#030309;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:950px;margin:auto;padding:14px 10px}.back{display:inline-block;padding:10px 13px;border:1px solid #ff2a88;border-radius:10px;color:#fff;text-decoration:none;background:#130714}h1{text-align:center;text-transform:uppercase;background:linear-gradient(90deg,#ff2a88,#18c5ff);-webkit-background-clip:text;color:transparent}p{text-align:center;color:#aaa}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.video{aspect-ratio:9/16;border:1px dashed #555;border-radius:13px;background:#0b0b13;display:grid;place-items:center;text-align:center;color:#999;padding:8px}@media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}}</style></head><body><div class="wrap"><a class="back" href="index.html">← HOME</a><h1 id="title"></h1><p>Video thumbnails will be added here.</p><div class="grid" id="grid"></div></div>
<script>const g=(new URLSearchParams(location.search).get("g")||"videos").replaceAll("-"," ");document.getElementById("title").textContent=g+" Videos";document.title=g+" Videos | TNEhindi";document.getElementById("grid").innerHTML=Array.from({length:10},(_,i)=>`<div class="video">Thumbnail ${i+1}<br>Coming Soon</div>`).join("")</script></body></html>
