<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TNEhindi Videos</title><style>
*{box-sizing:border-box}body{margin:0;background:#05050b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px 12px}
.back{color:#fff;text-decoration:none;display:inline-block;padding:10px 14px;border:1px solid #e21c55;border-radius:10px;background:#160713}
h1{text-align:center;text-transform:uppercase;margin:25px 0 5px}p{text-align:center;color:#aaa}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}
.slot{aspect-ratio:9/16;border:1px dashed #555;border-radius:14px;display:grid;place-items:center;text-align:center;background:linear-gradient(145deg,#11111c,#07070b);color:#aaa;padding:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}}</style></head><body><div class="wrap">
<a class="back" href="index.html">← HOME</a><h1 id="title">VIDEOS</h1><p>Video thumbnails will be added here.</p><div class="grid" id="grid"></div>
</div><script>
const p=new URLSearchParams(location.search),g=(p.get("g")||"videos").replaceAll("-"," ");
document.getElementById("title").textContent=g+" Videos";
document.title=g+" Videos | TNEhindi";
document.getElementById("grid").innerHTML=Array.from({length:10},(_,i)=>`<div class="slot">Thumbnail ${i+1}<br>Coming Soon</div>`).join("");
</script></body></html>
